<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#16697a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>离线英语学习助手</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">OFFLINE ENGLISH STUDIO</p>
      <h1>离线阅读写作助手</h1>
      <p>课程方法在本机，问答由手机本地 Qwen3 完成。</p>
      <div id="networkBadge" class="badge">检查离线状态</div>
      <button id="installOffline" class="install-offline">安装到手机桌面</button>
      <div id="updateBanner" class="update-banner" hidden>
        <span>发现新版本，课程方法或功能已更新。</span>
        <button id="applyUpdate">立即更新</button>
      </div>
      <p class="version">App 版本 <span id="appVersion">-</span></p>
    </header>

    <section class="panel model-panel">
      <h2>本地模型</h2>
      <label>模型
        <select id="modelSelect">
          <option value="Qwen3-4B-q4f16_1-MLC">Qwen3 4B（质量高，可能内存不足）</option>
          <option value="Qwen3-1.7B-q4f16_1-MLC">Qwen3 1.7B（稳定后尝试）</option>
          <option value="Qwen3-0.6B-q4f16_1-MLC" selected>Qwen3 0.6B（低内存兼容模式）</option>
        </select>
      </label>
      <button id="loadModel">下载并加载模型</button>
      <div class="progress"><span id="modelProgress"></span></div>
      <p id="modelStatus" class="hint">当前启用低内存模式：先使用 Qwen3 0.6B，成功后再测试 1.7B。出现 GPU Buffer 错误时不要使用 4B。</p>
    </section>

    <section class="panel chat-panel">
      <div class="chat-head">
        <h2>提问</h2>
        <select id="agent">
          <option value="cet4">四级</option>
          <option value="cet6">六级</option>
          <option value="postgrad">考研</option>
        </select>
      </div>
      <div id="messages" class="messages" aria-live="polite">
        <div class="bubble assistant">选择考试层级并加载模型，然后发送文字或题目照片。</div>
      </div>
      <form id="askForm">
        <textarea id="question" placeholder="输入阅读题、作文问题，或先拍照识别。"></textarea>
        <div class="photo-actions">
          <label class="photo-button">拍照<input id="cameraInput" type="file" accept="image/*" capture="environment"></label>
          <label class="photo-button secondary">相册<input id="photoInput" type="file" accept="image/*"></label>
          <button id="ocrButton" type="button" class="secondary">识别图片</button>
        </div>
        <img id="preview" alt="待识别图片">
        <button id="askButton" disabled>请先加载本地模型</button>
      </form>
    </section>

    <section class="panel">
      <h2>已内置课程方法</h2>
      <div id="courseList"></div>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
